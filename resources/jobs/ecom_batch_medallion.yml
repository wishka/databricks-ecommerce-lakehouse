# Основная ежедневная джоба: bronze → silver → gold → отчёт по качеству.
#
# Что здесь стоит рассмотреть внимательно:
#   * граф зависимостей через depends_on — движок сам распараллелит, что можно;
#   * job parameters: одно значение catalog прокидывается во все задачи;
#   * retries на шагах, которые могут упасть из-за временных причин;
#   * run_if на финальной задаче — она выполняется даже если DQ-шаг упал,
#     чтобы отчёт о падении всё равно был записан;
#   * max_concurrent_runs: 1 — витрины считаются overwrite, параллельные
#     запуски затирали бы друг друга.

resources:
  jobs:
    ecom_batch_medallion:
      name: "[${bundle.target}] ecom · batch medallion"
      description: Ежедневный пересчёт медальона на PySpark (Part 1)

      tags:
        project: ecom-lakehouse
        part: "1"

      max_concurrent_runs: 1

      schedule:
        quartz_cron_expression: "0 30 3 * * ?" # каждый день в 03:30 UTC
        timezone_id: UTC
        pause_status: PAUSED # включите вручную, когда наиграетесь

      parameters:
        - name: catalog
          default: ${var.catalog}

      tasks:
        - task_key: bronze
          description: Auto Loader → bronze
          notebook_task:
            notebook_path: ../../notebooks/01_batch/10_bronze_autoloader.py
            base_parameters:
              catalog: ${var.catalog}
              full_refresh: "false"
          max_retries: 2
          min_retry_interval_millis: 60000
          retry_on_timeout: true
          timeout_seconds: 3600

        - task_key: silver
          description: Очистка, DQ, SCD2
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: ../../notebooks/01_batch/11_silver_transform.py
            base_parameters:
              catalog: ${var.catalog}
          max_retries: 1
          timeout_seconds: 3600

        - task_key: gold
          description: Звезда и витрины
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: ../../notebooks/01_batch/12_gold_marts.py
            base_parameters:
              catalog: ${var.catalog}
          timeout_seconds: 3600

        - task_key: dq_report
          description: Сводка качества за запуск (выполняется в любом случае)
          depends_on:
            - task_key: silver
            - task_key: gold
          run_if: AT_LEAST_ONE_SUCCESS
          notebook_task:
            notebook_path: ../../notebooks/05_governance/52_dq_report.py
            base_parameters:
              catalog: ${var.catalog}

      # Уведомления: раскомментируйте и подставьте свой адрес
      # email_notifications:
      #   on_failure: ["you@example.com"]

      queue:
        enabled: true
